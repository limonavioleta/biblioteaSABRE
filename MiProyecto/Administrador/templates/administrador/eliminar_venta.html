{% extends 'administrador/base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
    <div class="card border-danger mt-5">
        <div class="card-header bg-danger text-white">
            <h4 class="m-0">Confirmar Eliminación</h4>
        </div>
        <div class="card-body">
            <p>¿Estás seguro/a de eliminar el registro de venta <strong>#{{ venta.id }}</strong>?</p>
            <form method="POST" class="d-flex justify-content-between mt-4">
                {% csrf_token %}
                <a href="{% url 'listar_ventas' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
