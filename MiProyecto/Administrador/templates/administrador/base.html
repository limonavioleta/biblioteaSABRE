<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <!-- Estilos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar simple (Menú de navegación) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">MiProyecto Admin</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'listar_productos' %}">Productos</a>
                <a class="nav-link" href="{% url 'listar_usuarios' %}">Usuarios</a>
                <a class="nav-link" href="{% url 'listar_ventas' %}">Ventas</a>
            </div>
        </div>
    </nav>

    <!-- EL "AGUJERO" DONDE SE INYECTARÁN TUS FORMULARIOS -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
